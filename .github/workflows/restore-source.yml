name: Restore RepoGhost source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore application source from temporary upload chunks
        shell: bash
        run: |
          set -euo pipefail
          test -d .source-chunks
          cat .source-chunks/part-* | base64 --decode > /tmp/repoghost-source.zip
          mkdir -p /tmp/repoghost-source
          unzip -q /tmp/repoghost-source.zip -d /tmp/repoghost-source
          test -d /tmp/repoghost-source/repoghost
          # Preserve the hand-reviewed root README already committed to this repo.
          cp -an /tmp/repoghost-source/repoghost/. .
          rm -rf .source-chunks
          rm -f .github/workflows/restore-source.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: add RepoGhost MVP source"
          git push
