name: RepoGhost CI

on:
  push:
    branches:
      - main
      - feat/developer-intelligence-suite
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Syntax and test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: npm run check
