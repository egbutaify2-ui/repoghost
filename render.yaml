services:
  - type: web
    name: repoghost
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_URL
        sync: false
